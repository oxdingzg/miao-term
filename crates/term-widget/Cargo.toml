[package]
name = "miao-term-widget"
description = "winit + wgpu native render loop for the miao-term engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
miao-term-core = { path = "../term-core" }
miao-term-render = { path = "../term-render" }
miao-term-ui = { path = "../term-ui" }
miao-term-mtp = { path = "../term-mtp" }
miao-term-platform = { path = "../term-platform" }
miao-term-config = { path = "../term-config" }
miao-term-editor = { path = "../term-editor" }
miao-term-lsp = { path = "../term-lsp" }
miao-term-keys = { path = "../term-keys" }
miao-term-acp = { path = "../term-acp" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = "0.30"
wgpu = "23"
pollster = "0.4"
egui = "0.30"
egui-winit = "0.30"
egui-wgpu = "0.30"
egui_extras = { version = "0.30", features = ["image", "file", "http"] }
egui_commonmark = "0.19"

[target.'cfg(target_os = "macos")'.dependencies]
# Native menu bar (MIT). Only used when the binary runs from an app bundle,
# which is where the application icon lives that AppKit's about panel wants.
# Patched locally — see vendor/muda/PATCHES.miao.md and ADR 0031.
muda = { version = "0.15", default-features = false }
# Apple Event handler for links opened from a browser or Finder (ADR 0019).
# Both are already in the tree through winit/muda.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# File drops on Wayland (winit 0.30 has them only for X11). The same crates
# winit uses, sharing its connection through the system libwayland.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
