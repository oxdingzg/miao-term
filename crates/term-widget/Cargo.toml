[package]
name = "miao-term-widget"
description = "winit + wgpu native render loop for the miao-term engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
miao-term-core = { path = "../term-core" }
miao-term-render = { path = "../term-render" }
miao-term-ui = { path = "../term-ui" }
miao-term-mtp = { path = "../term-mtp" }
miao-term-config = { path = "../term-config" }
serde_json = "1.0"
winit = "0.30"
wgpu = "23"
pollster = "0.4"
egui = "0.30"
egui-winit = "0.30"
egui-wgpu = "0.30"
egui_extras = { version = "0.30", features = ["image", "file"] }
egui_commonmark = "0.19"
