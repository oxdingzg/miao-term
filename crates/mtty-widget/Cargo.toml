[package]
name = "mtty-widget"
description = "winit + wgpu native render loop for the mtty engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
mtty-core = { path = "../mtty-core" }
mtty-ptyhost = { path = "../mtty-ptyhost" }
mtty-render = { path = "../mtty-render" }
mtty-ui = { path = "../mtty-ui" }
mtty-mtp = { path = "../mtty-mtp" }
mtty-platform = { path = "../mtty-platform" }
mtty-config = { path = "../mtty-config" }
mtty-editor = { path = "../mtty-editor" }
mtty-lsp = { path = "../mtty-lsp" }
mtty-keys = { path = "../mtty-keys" }
mtty-acp = { path = "../mtty-acp" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = "0.30"
wgpu = "23"
pollster = "0.4"
egui = "0.30"
egui-winit = "0.30"
egui-wgpu = "0.30"
egui_extras = { version = "0.30", features = ["image", "file", "http"] }
egui_commonmark = "0.19"

[target.'cfg(windows)'.dependencies]
# The pointer and Alt while files are dragged over the window (no window
# events arrive then). Already in the tree through winit.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Native menu bar (MIT). Only used when the binary runs from an app bundle,
# which is where the application icon lives that AppKit's about panel wants.
# Patched locally — see vendor/muda/PATCHES.miao.md and ADR 0031.
muda = { version = "0.15", default-features = false }
# Apple Event handler for links opened from a browser or Finder (ADR 0019).
# Both are already in the tree through winit/muda.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# File drops on Wayland (winit 0.30 has them only for X11). The same crates
# winit uses, sharing its connection through the system libwayland.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
image = { version = "0.25", default-features = false, features = ["png"] }
