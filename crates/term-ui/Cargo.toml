[package]
name = "miao-term-ui"
description = "Host-agnostic pieces shared by the mtty hosts: theme, input encoding, selection, row building, split layout, and egui chrome widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
miao-term-core = { path = "../term-core" }
miao-term-render = { path = "../term-render" }
miao-term-config = { path = "../term-config" }
miao-term-mtp = { path = "../term-mtp" }
miao-term-platform = { path = "../term-platform" }
egui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
minisign-verify = "0.3.0"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# System-wide Quick Terminal hotkey (MIT). See ADR 0019.
global-hotkey = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
# Wayland/X11 global shortcut through the XDG desktop portal (MIT). See ADR 0026.
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
