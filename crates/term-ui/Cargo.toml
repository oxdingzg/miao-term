[package]
name = "miao-term-ui"
description = "Host-agnostic pieces shared by the miaotty hosts: theme, input encoding, selection, row building, split layout, and egui chrome widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
miao-term-core = { path = "../term-core" }
miao-term-render = { path = "../term-render" }
miao-term-config = { path = "../term-config" }
egui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# System-wide Quick Terminal hotkey (MIT); only used on macOS/Windows.
global-hotkey = "0.8"
