[package]
name = "mtty-platform"
description = "Native system integration shared by the mtty hosts: notifications now, clipboard image access next (ADR 0035)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle", "NSError"] }
# Typed UserNotifications bindings, but only the pieces notifications use:
# the default feature set drags in unrelated action/attachment/category types
# and objc2-core-location, which mtty does not need.
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "NSString_UserNotifications",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
  "block2",
  "bitflags",
] }
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Native notifications through the freedesktop D-Bus service. zbus is already in
# the tree through ashpd (mtty-ui's global shortcut), so this reuses its build.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
# WinRT toasts under mtty's AppUserModelID, instead of BurntToast through
# PowerShell. The windows crate is already in the tree through winit.
windows = { version = "0.58", features = [
  "Data_Xml_Dom",
  "Foundation",
  "UI_Notifications",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
] }
