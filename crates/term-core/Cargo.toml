[package]
name = "miao-term-core"
description = "Terminal core: PTY, VT, grid, term, selection/search, OSC, input encoding (no GPU)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
alacritty_terminal = "0.25.0"
portable-pty = "0.9.0"
miao-term-ptyhost = { path = "../term-ptyhost" }
# Screen state snapshots (ADR 0041).
serde = { version = "1.0.229", features = ["derive"] }
miao-term-graphics = { path = "../term-graphics" }
# `perfgate` reads `benches/budgets.json` for the shared perf gate.
serde_json = "1.0.151"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1.0.151"

[target.'cfg(windows)'.dev-dependencies]
winreg = "0.10.1"
