[package]
name = "miao-term-editor"
description = "Text editing core for mtty's editor pane: rope, transactions, undo, selections, search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
regex = "1"
# LF-only line breaks: the default also splits at CR, form feed and Unicode
# separators, which disagrees with the line numbers git and compilers use.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
# Syntax highlighting (ADR 0034, E3): the core and the built-in grammars.
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
