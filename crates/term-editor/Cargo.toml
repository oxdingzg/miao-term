[package]
name = "miao-term-editor"
description = "Text editing core for mtty's editor pane: rope, transactions, undo, selections, search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Line breaks and search in large files read in place.
memchr = "2"
regex = "1"
# LF-only line breaks: the default also splits at CR, form feed and Unicode
# separators, which disagrees with the line numbers git and compilers use.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
# Fallback highlighting for languages without a built-in grammar: syntect's
# default (Sublime) syntax set, pure-Rust regexes, no themes.
syntect = { version = "5", default-features = false, features = ["parsing", "dump-load", "regex-fancy"] }
# Syntax highlighting (ADR 0034, E3): the core and the built-in grammars.
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-lua = "0.5"
tree-sitter-make = "1.1"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
arborium-ada = { version = "2.18", default-features = false }
arborium-asciidoc = { version = "2.18", default-features = false }
arborium-batch = { version = "2.18", default-features = false }
arborium-commonlisp = { version = "2.18", default-features = false }
arborium-gitattributes = { version = "2.18", default-features = false }
arborium-graphql = { version = "2.18", default-features = false }
arborium-hcl = { version = "2.18", default-features = false }
arborium-jinja2 = { version = "2.18", default-features = false }
arborium-jq = { version = "2.18", default-features = false }
arborium-just = { version = "2.18", default-features = false }
arborium-matlab = { version = "2.18", default-features = false }
arborium-meson = { version = "2.18", default-features = false }
arborium-perl = { version = "2.18", default-features = false }
arborium-proto = { version = "2.18", default-features = false }
arborium-scss = { version = "2.18", default-features = false }
arborium-ssh-config = { version = "2.18", default-features = false }
arborium-thrift = { version = "2.18", default-features = false }
arborium-typst = { version = "2.18", default-features = false }
arborium-vb = { version = "2.18", default-features = false }
arborium-vue = { version = "2.18", default-features = false }
arborium-zsh = { version = "2.18", default-features = false }
dekobon-tree-sitter-groovy = "0.3"
tree-sitter-asm = "0.24"
tree-sitter-bicep = "1.1"
tree-sitter-c-sharp = "0.23"
tree-sitter-clojure-orchard = "0.2"
tree-sitter-cmake = "0.7"
tree-sitter-containerfile = "0.9"
tree-sitter-dart = "0.2"
tree-sitter-diff = "0.1"
tree-sitter-elixir = "0.3"
tree-sitter-elm = "5.9"
tree-sitter-embedded-template = "0.25"
tree-sitter-erlang = "0.20"
tree-sitter-fish = "3.6"
tree-sitter-gleam = "1.0"
