[build-dependencies]
# Builds the embedded syntax dump (syntect's defaults plus vendor/syntaxes).
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "yaml-load", "dump-create", "regex-fancy"] }
