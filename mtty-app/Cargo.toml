[package]
name = "mtty-app"
description = "The mtty native terminal application, built on the mtty engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "mtty"
path = "src/main.rs"

[package.metadata.deb]
name = "mtty"
maintainer = "mtty contributors"
copyright = "Apache-2.0"
license-file = ["../LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
# The package was called miaotty before ADR 0032.
replaces = "miaotty"
conflicts = "miaotty"
provides = "miaotty"
assets = [
    ["target/release/mtty", "usr/bin/mtty", "755"],
    ["target/release/mtty-cli", "usr/bin/mtty-cli", "755"],
    ["target/release/mtty-ptyhost", "usr/bin/mtty-ptyhost", "755"],
    ["../assets/compat/miaotty", "usr/bin/miaotty", "755"],
    ["../assets/compat/miaotty-cli", "usr/bin/miaotty-cli", "755"],
    ["../assets/mtty.desktop", "usr/share/applications/mtty.desktop", "644"],
    # licence-file above covers mtty itself; this covers everything it is built on.
    ["../THIRD-PARTY-LICENSES.md", "usr/share/doc/mtty/THIRD-PARTY-LICENSES.md", "644"],
]

[dependencies]
mtty-config = { path = "../crates/mtty-config" }
mtty-widget = { path = "../crates/mtty-widget" }
serde_json = "1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# AttachConsole for --version/--help (already in the tree through winit).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[target.'cfg(windows)'.build-dependencies]
# Already used by the workspace; locates rc.exe in the Windows SDK.
find-msvc-tools = "0.1"

[dev-dependencies]
mtty-core = { path = "../crates/mtty-core" }
mtty-ui = { path = "../crates/mtty-ui" }
serde_json = "1.0.151"
