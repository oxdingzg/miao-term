[package]
name = "mtty-app"
description = "The mtty native terminal application, built on the miao-term engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "mtty"
path = "src/main.rs"

[package.metadata.deb]
name = "mtty"
maintainer = "mtty contributors"
copyright = "Apache-2.0"
license-file = ["../LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
# The package was called miaotty before ADR 0032.
replaces = "miaotty"
conflicts = "miaotty"
provides = "miaotty"
assets = [
    ["target/release/mtty", "usr/bin/mtty", "755"],
    ["target/release/mtty-cli", "usr/bin/mtty-cli", "755"],
    ["../assets/compat/miaotty", "usr/bin/miaotty", "755"],
    ["../assets/compat/miaotty-cli", "usr/bin/miaotty-cli", "755"],
    ["../assets/mtty.desktop", "usr/share/applications/mtty.desktop", "644"],
]

[dependencies]
miao-term-widget = { path = "../crates/term-widget" }

[target.'cfg(windows)'.dependencies]
# AttachConsole for --version/--help (already in the tree through winit).
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }

[dev-dependencies]
miao-term-core = { path = "../crates/term-core" }
miao-term-ui = { path = "../crates/term-ui" }
serde_json = "1.0.151"
