# mtty config — copy to ~/.config/mtty/config.toml
# (or $XDG_CONFIG_HOME/mtty/config.toml). All keys are optional.

font-size = 13                   # default
# font-family = "JetBrains Mono"   # any installed family; "JetBrains Mono" is the default
# line-height = 1.25               # multiple of the font size
# cursor-style = "block"           # block | bar | underline
# background-opacity = 1.0         # 0.1–1.0; <1 needs a compositing WM (translucent window)
# notifications = true             # system notification when an agent needs attention
# prevent-sleep = true             # keep the machine awake while an agent is processing
# restore-scrollback = true        # save terminals' contents at quit and show them on relaunch
# pty-host = true                 # updates, relaunches and crashes keep programs running
# keep-sessions-on-quit = false   # quitting keeps programs running too, like tmux
# detached-timeout = "24h"        # how long a kept program waits for mtty (90s, 30m, 24h, 7d)

# quick-terminal-hotkey = "cmd+shift+t"  # system-wide Quick Terminal toggle
# editor-vim = true                # minimal vim mode in the built-in editor
# editor = "code --wait"            # command used by "Edit in Tab"
# mermaid-command = "mmdc"          # render ```mermaid blocks with mermaid-cli (else a built-in subset)
# graphics = true                  # inline terminal graphics (Sixel / Kitty / iTerm2)
# remote-listen = "127.0.0.1:7273"   # serve the MTP control plane over TCP (needs MTTY_MTP_TOKEN)
# language = "zh"                  # UI language ("en" default; also reads $LANG)
# The update check runs only from the menu's "Check for Updates" — never at
# startup. update-check-url already points at this project's release manifest,
# so set it only to use a mirror or an internal host.
# update-pubkey = "RW…"            # minisign public key; enables signature checks
# update-check-url = "https://example.com/mtty/latest.json"
#   JSON manifest: {"version":"0.2.0","artifacts":{"macos-aarch64":{"url":"…","sha256":"…"}}}
#   A plain document whose first line is the version also works.

# [badges]                         # which agent states show on tabs (circle and mark)
# processing = true
# idle = true
# awaiting = true
# error = true

# Language servers for the editor pane: on by default for any that are
# installed (rust-analyzer, typescript-language-server, pyright-langserver,
# gopls, clangd), found on the login shell's PATH. Files over 2 MB get none.
# [lsp]
# enabled = false                  # all of them off
# [lsp.rust]                       # rust | typescript | python | go | c
# command = "rust-analyzer"        # a string split at spaces, or a list
# root-markers = ["Cargo.toml"]    # the nearest folder with one is the workspace
# [lsp.python]
# command = ["pylsp"]
# [lsp.go]
# enabled = false

# ACP (Agent Client Protocol) agents: every entry can be started from the
# command palette's "ACP Agent…" and drives a transcript window (ADR 0040).
# command is a string split at spaces, or a list.
# [acp]
# [[acp.agent]]
# name = "codex"
# command = "codex acp"
# [[acp.agent]]
# name = "gemini"
# command = ["gemini", "--experimental-acp"]

# Built-in named theme: nord | dracula | gruvbox | solarized | tokyo-night.
# theme = "dracula"   # overridden by explicit [colors] below

[colors]
background = "#2e3440"
foreground = "#d8dee9"
palette = [
  "#3b4252", "#bf616a", "#a3be8c", "#ebcb8b",
  "#81a1c1", "#b48ead", "#88c0d0", "#e5e9f0",
  "#4c566a", "#bf616a", "#a3be8c", "#ebcb8b",
  "#81a1c1", "#b48ead", "#8fbcbb", "#eceff4",
]
