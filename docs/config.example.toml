# miaotty config — copy to ~/.config/miaotty/config.toml
# (or $XDG_CONFIG_HOME/miaotty/config.toml). All keys are optional.

font-size = 14

[colors]
background = "#2e3440"
foreground = "#d8dee9"
palette = [
  "#3b4252", "#bf616a", "#a3be8c", "#ebcb8b",
  "#81a1c1", "#b48ead", "#88c0d0", "#e5e9f0",
  "#4c566a", "#bf616a", "#a3be8c", "#ebcb8b",
  "#81a1c1", "#b48ead", "#8fbcbb", "#eceff4",
]
