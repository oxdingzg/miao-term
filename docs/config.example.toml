# miaotty config — copy to ~/.config/miaotty/config.toml
# (or $XDG_CONFIG_HOME/miaotty/config.toml). All keys are optional.

font-size = 14
# font-family = "JetBrains Mono"   # any installed family; default follows the system monospace
# line-height = 1.25               # multiple of the font size
# cursor-style = "block"           # block | bar | underline
# background-opacity = 1.0         # 0.2–1.0; <1 needs a compositing WM (translucent window)

# Built-in named theme: nord | dracula | gruvbox | solarized | tokyo-night.
# theme = "dracula"   # overridden by explicit [colors] below

[colors]
background = "#2e3440"
foreground = "#d8dee9"
palette = [
  "#3b4252", "#bf616a", "#a3be8c", "#ebcb8b",
  "#81a1c1", "#b48ead", "#88c0d0", "#e5e9f0",
  "#4c566a", "#bf616a", "#a3be8c", "#ebcb8b",
  "#81a1c1", "#b48ead", "#8fbcbb", "#eceff4",
]
