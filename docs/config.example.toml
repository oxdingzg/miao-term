# miaotty config — copy to ~/.config/miaotty/config.toml
# (or $XDG_CONFIG_HOME/miaotty/config.toml). All keys are optional.

font-size = 14
# font-family = "JetBrains Mono"   # any installed family; default follows the system monospace
# line-height = 1.25               # multiple of the font size
# cursor-style = "block"           # block | bar | underline
# background-opacity = 1.0         # 0.2–1.0; <1 needs a compositing WM (translucent window)
# notifications = true             # system notification when an agent needs attention
# prevent-sleep = true             # keep the machine awake while an agent is processing

# quick-terminal-hotkey = "cmd+shift+t"  # system-wide Quick Terminal toggle
# editor-vim = true                # minimal vim mode in the built-in editor
# editor = "code --wait"            # command used by "Edit in Tab"
# mermaid-command = "mmdc"          # render ```mermaid blocks with mermaid-cli (else a built-in subset)
# graphics = true                  # inline terminal graphics (Sixel / Kitty / iTerm2)
# remote-listen = "127.0.0.1:7273"   # serve the MTP control plane over TCP (needs MIAOTTY_MTP_TOKEN)
# language = "zh"                  # UI language ("en" default; also reads $LANG)
# update-pubkey = "RW…"            # minisign public key; enables signature checks
# update-check-url = "https://example.com/miaotty/latest.json"
#   JSON manifest: {"version":"0.2.0","artifacts":{"macos-aarch64":{"url":"…","sha256":"…"}}}
#   A plain document whose first line is the version also works.

# [badges]                         # which agent states show a tab badge
# processing = true
# idle = true
# awaiting = true
# error = true

# Built-in named theme: nord | dracula | gruvbox | solarized | tokyo-night.
# theme = "dracula"   # overridden by explicit [colors] below

[colors]
background = "#2e3440"
foreground = "#d8dee9"
palette = [
  "#3b4252", "#bf616a", "#a3be8c", "#ebcb8b",
  "#81a1c1", "#b48ead", "#88c0d0", "#e5e9f0",
  "#4c566a", "#bf616a", "#a3be8c", "#ebcb8b",
  "#81a1c1", "#b48ead", "#8fbcbb", "#eceff4",
]
