[workspace]
resolver = "2"
members = ["crates/*", "miaotty-app", "miaotty-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/oxdingzg/miao-term"
authors = ["miaotty contributors"]

[profile.release]
lto = "thin"
codegen-units = 1

# egui/wgpu/glyphon are unusably slow unoptimized and dominate frame time, so
# optimize dependencies even in dev builds (our own crate stays debuggable).
[profile.dev.package."*"]
opt-level = 3
