[workspace]
resolver = "2"
members = ["crates/*", "miaotty-app", "miaotty-cli"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
repository = "https://github.com/oxdingzg/miao-term"
authors = ["miaotty contributors"]

[profile.release]
lto = "thin"
codegen-units = 1
