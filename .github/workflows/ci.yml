name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cache the registry + target so a push does not recompile ~450 crates.
      - uses: Swatinem/rust-cache@v2
      # `cargo test` compiles the whole workspace, so a separate `cargo check`
      # only doubled the compile time.
      - run: cargo test --workspace

  render-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Real Linux wgpu coverage (ADR 0030) without a GPU: install Mesa's
      # software Vulkan (lavapipe) and require the headless smoke test to run.
      - name: Install software Vulkan (lavapipe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1
      - name: Headless render smoke (lavapipe)
        env:
          MIAO_REQUIRE_GPU: "1"
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: cargo test -p miao-term-render -- --nocapture

  perf:
    runs-on: ubuntu-latest
    env:
      # Looser than the local 25% so shared-runner noise does not flake.
      PERF_REGRESSION_PCT: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Performance gate (ADR 0018/0028): release-mode budgets plus a baseline
      # comparison against this runner's own previous measurements.
      - uses: actions/cache@v4
        with:
          path: .perf
          key: perf-baseline-${{ runner.os }}-${{ github.sha }}
          restore-keys: perf-baseline-${{ runner.os }}-
      - run: cargo test --release -p miao-term-core -p miaotty-app -- --ignored
      - name: Compare against the CI baseline
        run: python3 scripts/check-perf-baseline.py
      - name: Update the baseline (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p .perf
          cp target/perf-measured.json .perf/baseline.json
          cat .perf/baseline.json

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fail if the tree leaks machine-specific details or secrets (AGENTS.md).
      # Add your own identifiers (host aliases, usernames, internal hostnames)
      # to the repository secret PRIVACY_DENYLIST, one per line.
      - name: Machine-specific / secret scan
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: sh scripts/check-privacy.sh
