name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Performance gate (ADR 0018): release-mode budgets, generous headroom.
      - run: cargo test --release -p miao-term-core -p miaotty-app -- --ignored

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fail if the tree leaks machine-specific details or secrets (AGENTS.md).
      # Add your own identifiers (host aliases, usernames, internal hostnames)
      # to the repository secret PRIVACY_DENYLIST, one per line.
      - name: Machine-specific / secret scan
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: sh scripts/check-privacy.sh
