name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Full three-OS test matrix once a night (and on demand).
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

# Rapid pushes to the same branch cancel the previous run instead of queueing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether anything but docs changed, so docs-only pushes stay fast
  # (they still run `privacy`).
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            range="${{ github.event.before }}...${{ github.sha }}"
          else
            range=""
          fi
          if [ -z "$range" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$range" | grep -qvE '\.(md|txt)$|^docs/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cache the registry + target so a push does not recompile ~450 crates.
      - uses: Swatinem/rust-cache@v2
      # Pushes run the suite on Linux only (fast); macOS/Windows compile-check.
      # PRs, the nightly run and manual runs test all three (ConPTY etc.).
      - name: Test
        if: github.event_name != 'push' || runner.os == 'Linux'
        run: cargo test --workspace
      - name: Check (compile only)
        if: github.event_name == 'push' && runner.os != 'Linux'
        run: cargo check --workspace --all-targets

  render-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Real Linux wgpu coverage (ADR 0030) without a GPU: install Mesa's
      # software Vulkan (lavapipe) and require the headless smoke test to run.
      - name: Install software Vulkan (lavapipe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1
      - name: Headless render smoke (lavapipe)
        env:
          MIAO_REQUIRE_GPU: "1"
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: cargo test -p miao-term-render -- --nocapture

  perf:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # Looser than the local 25% so shared-runner noise does not flake.
      PERF_REGRESSION_PCT: "40"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Performance gate (ADR 0018/0028): release-mode budgets plus a baseline
      # comparison against this runner's own previous measurements.
      - uses: actions/cache@v4
        with:
          path: .perf
          key: perf-baseline-${{ runner.os }}-${{ github.sha }}
          restore-keys: perf-baseline-${{ runner.os }}-
      - run: cargo test --release -p miao-term-core -p miaotty-app -- --ignored
      - name: Compare against the CI baseline
        run: python3 scripts/check-perf-baseline.py
      - name: Update the baseline (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p .perf
          cp target/perf-measured.json .perf/baseline.json
          cat .perf/baseline.json

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fail if the tree leaks machine-specific details or secrets (AGENTS.md).
      # Add your own identifiers (host aliases, usernames, internal hostnames)
      # to the repository secret PRIVACY_DENYLIST, one per line.
      - name: Machine-specific / secret scan
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: sh scripts/check-privacy.sh
