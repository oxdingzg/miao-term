name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version used for the rehearsal manifest (no Release is published)"
        default: "v0.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --release -p miaotty-app -p miaotty-cli -p miao-term-widget

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: PROFILE=release scripts/package-macos.sh

      - name: Package native (macOS)
        if: runner.os == 'macOS'
        run: |
          ARCH=$(uname -m)
          zip -j "miaotty-native-macos-$ARCH.zip" target/release/miaotty-native

      - name: Sign & notarize (macOS, optional)
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -e
          ARCH=$(uname -m)
          if [ -n "$APPLE_CERT_P12" ]; then
            echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
            security create-keychain -p actions tmp.keychain
            security import cert.p12 -k tmp.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k actions tmp.keychain
            IDENTITY=$(security find-identity -v -p codesigning tmp.keychain | awk '{print $2}' | head -1)
            codesign --force --deep --options runtime --sign "$IDENTITY" dist/miaotty.app
            codesign --force --deep --options runtime --sign "$IDENTITY" dist/miaotty-native.app
            (cd dist && zip -qry "../miaotty-macos-$ARCH.zip" miaotty.app miaotty-native.app)
            xcrun notarytool submit "miaotty-macos-$ARCH.zip" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple dist/miaotty.app
            xcrun stapler staple dist/miaotty-native.app
            rm -f "miaotty-macos-$ARCH.zip"
          else
            echo "no signing secrets; shipping ad-hoc signed build"
          fi
          (cd dist && zip -qry "../miaotty-macos-$ARCH.zip" miaotty.app miaotty-native.app)

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/miaotty target/release/miaotty-cli target/release/miaotty-native dist/
          tar -C dist -czf miaotty-linux-x86_64.tar.gz .
          cargo install cargo-deb --locked
          cargo deb -p miaotty-app --no-build
          cp target/debian/*.deb dist/

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          AppDir=AppDir
          mkdir -p "$AppDir/usr/bin" "$AppDir/usr/share/applications" \
                   "$AppDir/usr/share/icons/hicolor/256x256/apps"
          cp target/release/miaotty target/release/miaotty-cli target/release/miaotty-native "$AppDir/usr/bin/"
          cp assets/AppRun "$AppDir/AppRun"
          chmod +x "$AppDir/AppRun"
          cat > "$AppDir/miaotty.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=miaotty
          Exec=miaotty %u
          Icon=miaotty
          Categories=System;TerminalEmulator;
          MimeType=x-scheme-handler/miaotty;x-scheme-handler/ssh;x-scheme-handler/x-man-page;
          Terminal=false
          EOF
          cp "$AppDir/miaotty.desktop" "$AppDir/usr/share/applications/"
          # A real 256x256 icon: appimagetool rejects a 1x1 placeholder.
          python3 scripts/make-icon.py "$AppDir/miaotty.png" 2e3440
          cp "$AppDir/miaotty.png" "$AppDir/usr/share/icons/hicolor/256x256/apps/miaotty.png"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$AppDir" miaotty-linux-x86_64.AppImage

      - name: Verify Linux package contents
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          dpkg-deb --extract dist/*.deb "$RUNNER_TEMP/deb-check"
          chmod +x miaotty-linux-x86_64.AppImage
          ./miaotty-linux-x86_64.AppImage --appimage-extract
          for binary in miaotty miaotty-cli miaotty-native; do
            test -x "$RUNNER_TEMP/deb-check/usr/bin/$binary"
            test -x "squashfs-root/usr/bin/$binary"
          done
          test -x squashfs-root/AppRun
          cmp assets/AppRun squashfs-root/AppRun
          "$RUNNER_TEMP/deb-check/usr/bin/miaotty-cli" --help
          squashfs-root/usr/bin/miaotty-cli --help

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/miaotty.exe dist/
          Copy-Item target/release/miaotty-cli.exe dist/
          Copy-Item target/release/miaotty-native.exe dist/
          Compress-Archive -Path dist/* -DestinationPath miaotty-windows-x86_64.zip

      - name: MSI (Windows)
        if: runner.os == 'Windows'
        run: |
          # WiX 3.x via chocolatey (preinstalled on the runner images); cargo-wix
          # picks it up through the WIX environment variable.
          choco install -y wixtoolset --no-progress
          cargo install cargo-wix --locked
          cargo build --release -p miaotty-cli
          # The WiX template lives in miaotty-app/wix and references wix\License.rtf
          # relative to the crate, so build from there.
          cd miaotty-app
          cargo wix --package miaotty-app --nocapture

      - name: Verify MSI install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem target/wix/*.msi | Select-Object -First 1).FullName
          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "MSI installation failed: $($install.ExitCode)" }
          try {
            $bin = Join-Path $env:ProgramFiles 'miaotty/bin'
            foreach ($name in @('miaotty.exe', 'miaotty-cli.exe', 'miaotty-native.exe')) {
              if (-not (Test-Path (Join-Path $bin $name))) { throw "Missing installed binary: $name" }
            }
            & (Join-Path $bin 'miaotty-cli.exe') --help
            if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed' }
            $command = (Get-Item 'Registry::HKEY_CLASSES_ROOT\miaotty\shell\open\command').GetValue('')
            if (-not $command.Contains('miaotty.exe')) { throw 'Missing URL handler' }
          } finally {
            $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
            if ($uninstall.ExitCode -notin @(0, 3010)) { throw "MSI uninstall failed: $($uninstall.ExitCode)" }
          }
          if (Test-Path (Join-Path $env:ProgramFiles 'miaotty/bin/miaotty-native.exe')) { throw 'MSI left an installed binary behind' }

      - name: Sign MSI (Windows, optional)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX) { Write-Host 'no cert; skipping MSI signing'; exit 0 }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $msi = (Get-ChildItem target/wix/*.msi | Select-Object -First 1).FullName
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object -Descending | Select-Object -First 1).FullName
          & $signtool sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 $msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI signing failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: miaotty-${{ matrix.os }}
          path: |
            miaotty-*.zip
            miaotty-*.tar.gz
            miaotty-*.AppImage
            miaotty-*.sig
            dist/*.deb
            dist/*.deb.sig
            target/wix/*.msi
            target/wix/*.msi.sig

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect packages into the release directory
        run: python3 scripts/build-update-manifest.py artifacts --collect-only
      # Ship the minisign public key so users can verify the `.sig` files.
      - name: Add the signing public key
        run: cp minisign.pub artifacts/

      # Detached signing is platform-independent. Sign once on Linux rather
      # than relying on the obsolete minisign 0.8 Chocolatey package.
      - name: Sign artifacts (minisign, optional)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "no minisign key; skipping artifact signing"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          shopt -s nullglob
          for f in artifacts/*.zip artifacts/*.tar.gz artifacts/*.AppImage artifacts/*.deb artifacts/*.msi; do
            minisign -S -W -s "$key" -m "$f" -x "$f.sig"
            echo "signed $f"
          done

      - name: Build the update manifest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SIGNING_CONFIGURED: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
        run: |
          set -euo pipefail
          python3 scripts/test-release-manifest.py
          options=()
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            options+=(--require-signatures)
          fi
          python3 scripts/build-update-manifest.py artifacts --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" "${options[@]}"

      - name: Verify detached signatures
        run: |
          set -euo pipefail
          shopt -s nullglob
          signatures=(artifacts/*.sig)
          if [ "${#signatures[@]}" -eq 0 ]; then
            echo "no detached signatures to verify"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          for signature in "${signatures[@]}"; do
            minisign -Vm "${signature%.sig}" -x "$signature" -p artifacts/minisign.pub
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-assembled
          path: artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes
