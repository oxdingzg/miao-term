name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version used for the rehearsal manifest (no Release is published)"
        default: "v0.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --release -p mtty-app -p mtty-cli

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: PROFILE=release scripts/package-macos.sh

      - name: Sign & notarize (macOS, optional)
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -e
          ARCH=$(uname -m)
          if [ -n "$APPLE_CERT_P12" ]; then
            echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
            security create-keychain -p actions tmp.keychain
            security import cert.p12 -k tmp.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k actions tmp.keychain
            IDENTITY=$(security find-identity -v -p codesigning tmp.keychain | awk '{print $2}' | head -1)
            codesign --force --deep --options runtime --sign "$IDENTITY" dist/mtty.app
            (cd dist && zip -qry "../mtty-macos-$ARCH.zip" mtty.app)
            xcrun notarytool submit "mtty-macos-$ARCH.zip" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple dist/mtty.app
            rm -f "mtty-macos-$ARCH.zip"
          else
            echo "no signing secrets; shipping ad-hoc signed build"
          fi
          (cd dist && zip -qry "../mtty-macos-$ARCH.zip" mtty.app)

      - name: Verify single macOS application
        if: runner.os == 'macOS'
        run: |
          python3 scripts/check-macos-bundle.py dist/mtty.app
          dist/mtty.app/Contents/MacOS/mtty --version
          test ! -e dist/miaotty-native.app
          test ! -e dist/miaotty.app

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/mtty target/release/mtty-cli dist/
          tar -C dist -czf mtty-linux-x86_64.tar.gz .
          cargo install cargo-deb --locked
          cargo deb -p mtty-app --no-build
          cp target/debian/*.deb dist/

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -e
          AppDir=AppDir
          mkdir -p "$AppDir/usr/bin" "$AppDir/usr/share/applications" \
                   "$AppDir/usr/share/icons/hicolor/256x256/apps"
          cp target/release/mtty target/release/mtty-cli "$AppDir/usr/bin/"
          cp assets/AppRun "$AppDir/AppRun"
          chmod +x "$AppDir/AppRun"
          cp assets/mtty.desktop "$AppDir/mtty.desktop"
          cp "$AppDir/mtty.desktop" "$AppDir/usr/share/applications/"
          # A real 256x256 icon: appimagetool rejects a 1x1 placeholder.
          python3 scripts/make-icon.py "$AppDir/mtty.png" 2e3440
          cp "$AppDir/mtty.png" "$AppDir/usr/share/icons/hicolor/256x256/apps/mtty.png"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$AppDir" mtty-linux-x86_64.AppImage

      - name: Verify Linux package contents
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          dpkg-deb --extract dist/*.deb "$RUNNER_TEMP/deb-check"
          chmod +x mtty-linux-x86_64.AppImage
          ./mtty-linux-x86_64.AppImage --appimage-extract
          for binary in mtty mtty-cli; do
            test -x "$RUNNER_TEMP/deb-check/usr/bin/$binary"
            test -x "squashfs-root/usr/bin/$binary"
          done
          # Pre-rename aliases (ADR 0032).
          for alias in miaotty miaotty-cli; do
            test -x "$RUNNER_TEMP/deb-check/usr/bin/$alias"
          done
          dpkg-deb --field dist/*.deb Replaces | grep -qw miaotty
          test -x squashfs-root/AppRun
          cmp assets/AppRun squashfs-root/AppRun
          "$RUNNER_TEMP/deb-check/usr/bin/mtty-cli" --help
          squashfs-root/usr/bin/mtty-cli --help

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/check-windows-icon.py target/release/mtty.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable icon check failed' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/mtty.exe dist/
          Copy-Item target/release/mtty-cli.exe dist/
          Compress-Archive -Path dist/* -DestinationPath mtty-windows-x86_64.zip

      - name: MSI (Windows)
        if: runner.os == 'Windows'
        run: |
          # WiX 3.x via chocolatey (preinstalled on the runner images); cargo-wix
          # picks it up through the WIX environment variable.
          choco install -y wixtoolset --no-progress
          cargo install cargo-wix --locked
          cargo build --release -p mtty-cli
          # The WiX template lives in mtty-app/wix and references wix\License.rtf
          # relative to the crate, so build from there.
          cd mtty-app
          cargo wix --package mtty-app --nocapture

      - name: Verify MSI install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem target/wix/*.msi | Select-Object -First 1).FullName
          $installLog = Join-Path $PWD 'mtty-msi-install.log'
          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart', '/l*v', "`"$installLog`"") -Wait -PassThru
          Select-String -Path $installLog -Pattern 'ARPPRODUCTICON|DisplayIcon|RegisterProduct|Return value 3|Icon:' | ForEach-Object { Write-Host $_.Line }
          if ($install.ExitCode -notin @(0, 3010)) { throw "MSI installation failed: $($install.ExitCode)" }
          try {
            $bin = Join-Path $env:ProgramFiles 'mtty/bin'
            foreach ($name in @('mtty.exe', 'mtty-cli.exe')) {
              if (-not (Test-Path (Join-Path $bin $name))) { throw "Missing installed binary: $name" }
            }
            & (Join-Path $bin 'mtty-cli.exe') --help
            if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed' }
            python scripts/check-windows-icon.py (Join-Path $bin 'mtty.exe')
            if ($LASTEXITCODE -ne 0) { throw 'Installed executable icon check failed' }
            $entry = Get-ItemProperty @('HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*', 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*') -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -eq 'mtty' }
            if (-not $entry) { throw 'Missing installed application registration' }
            $installer = New-Object -ComObject WindowsInstaller.Installer
            # MSI exposes its primary icon through ProductInfo, not necessarily
            # through the ordinary Uninstall key's DisplayIcon value.
            $registeredIcon = [string]$installer.ProductInfo($entry.PSChildName, 'ProductIcon')
            if (-not $registeredIcon) { throw 'Missing installed application icon' }
            if (-not (Test-Path $registeredIcon)) { throw 'Registered application icon does not exist' }
            python scripts/check-windows-icon.py $registeredIcon
            if ($LASTEXITCODE -ne 0) { throw 'Registered application icon check failed' }
            $shortcuts = @(
              (Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'mtty/mtty.lnk'),
              (Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'mtty.lnk')
            )
            $shell = New-Object -ComObject WScript.Shell
            foreach ($shortcut in $shortcuts) {
              if (-not (Test-Path $shortcut)) { throw "Missing shortcut: $shortcut" }
              $link = $shell.CreateShortcut($shortcut)
              if ($link.TargetPath -ne (Join-Path $bin 'mtty.exe')) { throw "Wrong shortcut target: $shortcut" }
              if (-not $link.IconLocation.Contains('mtty.exe')) { throw "Missing shortcut icon: $shortcut" }
            }
            foreach ($scheme in @('mtty', 'miaotty')) {
              $command = (Get-Item "Registry::HKEY_CLASSES_ROOT\$scheme\shell\open\command").GetValue('')
              if (-not $command.Contains('mtty.exe')) { throw "Missing URL handler: $scheme" }
            }
          } finally {
            $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
            if ($uninstall.ExitCode -notin @(0, 3010)) { throw "MSI uninstall failed: $($uninstall.ExitCode)" }
          }
          if (Test-Path (Join-Path $env:ProgramFiles 'mtty/bin/mtty.exe')) { throw 'MSI left an installed binary behind' }
          foreach ($shortcut in $shortcuts) {
            if (Test-Path $shortcut) { throw "MSI left a shortcut behind: $shortcut" }
          }

      - name: Sign MSI (Windows, optional)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX) { Write-Host 'no cert; skipping MSI signing'; exit 0 }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $msi = (Get-ChildItem target/wix/*.msi | Select-Object -First 1).FullName
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object -Descending | Select-Object -First 1).FullName
          & $signtool sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 $msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI signing failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: mtty-${{ matrix.os }}
          path: |
            mtty-*.zip
            mtty-*.tar.gz
            mtty-*.AppImage
            mtty-*.sig
            dist/*.deb
            dist/*.deb.sig
            target/wix/*.msi
            target/wix/*.msi.sig

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect packages into the release directory
        run: python3 scripts/build-update-manifest.py artifacts --collect-only
      # Ship the minisign public key so users can verify the `.sig` files.
      - name: Add the signing public key
        run: cp minisign.pub artifacts/

      # Detached signing is platform-independent. Sign once on Linux rather
      # than relying on the obsolete minisign 0.8 Chocolatey package.
      - name: Sign artifacts (minisign, optional)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "no minisign key; skipping artifact signing"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          shopt -s nullglob
          for f in artifacts/*.zip artifacts/*.tar.gz artifacts/*.AppImage artifacts/*.deb artifacts/*.msi; do
            minisign -S -W -s "$key" -m "$f" -x "$f.sig"
            echo "signed $f"
          done

      - name: Build the update manifest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          SIGNING_CONFIGURED: ${{ secrets.MINISIGN_SECRET_KEY != '' }}
        run: |
          set -euo pipefail
          python3 scripts/test-release-manifest.py
          options=()
          if [ "$SIGNING_CONFIGURED" = "true" ]; then
            options+=(--require-signatures)
          fi
          python3 scripts/build-update-manifest.py artifacts --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" "${options[@]}"

      - name: Verify detached signatures
        run: |
          set -euo pipefail
          shopt -s nullglob
          signatures=(artifacts/*.sig)
          if [ "${#signatures[@]}" -eq 0 ]; then
            echo "no detached signatures to verify"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          for signature in "${signatures[@]}"; do
            minisign -Vm "${signature%.sig}" -x "$signature" -p artifacts/minisign.pub
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-assembled
          path: artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes
