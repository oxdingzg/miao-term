name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p miaotty-app -p miaotty-cli -p miao-term-widget

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: PROFILE=release scripts/package-macos.sh

      - name: Package native (macOS)
        if: runner.os == 'macOS'
        run: zip -j miaotty-native-macos-arm64.zip target/release/miaotty-native

      - name: Sign & notarize (macOS, optional)
        if: runner.os == 'macOS'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -e
          if [ -n "$APPLE_CERT_P12" ]; then
            echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
            security create-keychain -p actions tmp.keychain
            security import cert.p12 -k tmp.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k actions tmp.keychain
            IDENTITY=$(security find-identity -v -p codesigning tmp.keychain | awk '{print $2}' | head -1)
            codesign --force --deep --options runtime --sign "$IDENTITY" dist/miaotty.app
            ditto -c -k --keepParent dist/miaotty.app miaotty-macos-arm64.zip
            xcrun notarytool submit miaotty-macos-arm64.zip \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple dist/miaotty.app
            rm -f miaotty-macos-arm64.zip
          else
            echo "no signing secrets; shipping ad-hoc signed build"
          fi
          ditto -c -k --keepParent dist/miaotty.app miaotty-macos-arm64.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/release/miaotty target/release/miaotty-cli target/release/miaotty-native dist/
          tar -C dist -czf miaotty-linux-x86_64.tar.gz .
          cargo install cargo-deb --locked
          cargo deb -p miaotty-app --no-build
          cp target/debian/*.deb dist/ 2>/dev/null || true

      - name: AppImage (Linux, best-effort)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          set -e
          AppDir=AppDir
          mkdir -p "$AppDir/usr/bin" "$AppDir/usr/share/applications" \
                   "$AppDir/usr/share/icons/hicolor/256x256/apps"
          cp target/release/miaotty target/release/miaotty-cli target/release/miaotty-native "$AppDir/usr/bin/"
          cat > "$AppDir/miaotty.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=miaotty
          Exec=miaotty
          Icon=miaotty
          Categories=System;TerminalEmulator;
          Terminal=false
          EOF
          cp "$AppDir/miaotty.desktop" "$AppDir/usr/share/applications/"
          # A real 256x256 icon: appimagetool rejects a 1x1 placeholder.
          python3 scripts/make-icon.py "$AppDir/miaotty.png" 2e3440
          cp "$AppDir/miaotty.png" "$AppDir/usr/share/icons/hicolor/256x256/apps/miaotty.png"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$AppDir" miaotty-linux-x86_64.AppImage

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/miaotty.exe dist/
          Copy-Item target/release/miaotty-cli.exe dist/
          Copy-Item target/release/miaotty-native.exe dist/
          Compress-Archive -Path dist/* -DestinationPath miaotty-windows-x86_64.zip

      - name: MSI (Windows, best-effort)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          # WiX 3.x via chocolatey (preinstalled on the runner images); cargo-wix
          # picks it up through the WIX environment variable.
          choco install -y wixtoolset --no-progress
          cargo install cargo-wix --locked
          cargo build --release -p miaotty-cli
          # The WiX template lives in miaotty-app/wix and references wix\License.rtf
          # relative to the crate, so build from there.
          cd miaotty-app
          cargo wix --package miaotty-app --nocapture

      - name: Sign MSI (Windows, optional)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX) { Write-Host 'no cert; skipping MSI signing'; exit 0 }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $msi = (Get-ChildItem target/wix/*.msi | Select-Object -First 1).FullName
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object -Descending | Select-Object -First 1).FullName
          & $signtool sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 $msi

      - name: Sign artifacts (minisign, optional)
        if: env.MINISIGN_SECRET_KEY != ''
        shell: bash
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)  sudo apt-get update -qq && sudo apt-get install -y -qq minisign ;;
            macOS)  brew install minisign ;;
            Windows) choco install -y minisign ;;
          esac
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          shopt -s nullglob
          for f in miaotty-*.zip miaotty-*.tar.gz miaotty-*.AppImage dist/*.deb target/wix/*.msi; do
            [ -f "$f" ] || continue
            minisign -S -W -s "$key" -m "$f" -x "$f.sig"
            echo "signed $f"
          done
          rm -f "$key"

      - uses: actions/upload-artifact@v4
        with:
          name: miaotty-${{ matrix.os }}
          path: |
            miaotty-*.zip
            miaotty-*.tar.gz
            miaotty-*.AppImage
            miaotty-*.sig
            dist/*.deb
            dist/*.deb.sig
            target/wix/*.msi
            target/wix/*.msi.sig

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      # Ship the minisign public key so users can verify the `.sig` files.
      - name: Add the signing public key
        run: cp minisign.pub artifacts/
      - name: Build the update manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          tag = os.environ["GITHUB_REF_NAME"]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/{tag}"
          version = tag.lstrip("v")

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()

          # Map artifact filename patterns to the platform keys the app asks for.
          patterns = [
              ("macos-aarch64", r"miaotty-macos.*\.zip$"),
              ("macos-x86_64", r"miaotty-macos-x86_64.*\.zip$"),
              ("linux-x86_64", r"miaotty-linux.*\.(tar\.gz|AppImage)$"),
              ("linux-x86_64-deb", r"miaotty_.*_amd64\.deb$"),
              ("windows-x86_64", r"(miaotty-windows.*\.zip|miaotty-.*\.msi)$"),
          ]
          artifacts = {}
          for path in sorted(pathlib.Path("artifacts").iterdir()):
              name = path.name
              if name.endswith(".sig") or not path.is_file():
                  continue
              for key, rx in patterns:
                  if re.search(rx, name):
                      entry = {
                          "url": f"{base}/{name}",
                          "sha256": sha256(path),
                      }
                      sig = path.with_suffix(path.suffix + ".sig")
                      if sig.exists():
                          entry["signature"] = f"{base}/{sig.name}"
                      artifacts.setdefault(key, entry)
          manifest = {"version": version, "artifacts": artifacts}
          pathlib.Path("artifacts/latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes
