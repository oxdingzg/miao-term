[package]
name = "miaotty-app"
description = "The miaotty native terminal application, built on the miao-term engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "miaotty"
path = "src/main.rs"

[package.metadata.deb]
name = "miaotty"
maintainer = "miaotty"
copyright = "Apache-2.0"
license-file = ["../LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/miaotty", "usr/bin/miaotty", "755"],
    ["target/release/miaotty-cli", "usr/bin/miaotty-cli", "755"],
    ["../assets/miaotty.desktop", "usr/share/applications/miaotty.desktop", "644"],
]

[dependencies]
miao-term-widget = { path = "../crates/term-widget" }

[dev-dependencies]
miao-term-core = { path = "../crates/term-core" }
miao-term-ui = { path = "../crates/term-ui" }
serde_json = "1.0.151"
