[package]
name = "miaotty-app"
description = "The miaotty terminal application, built on the miao-term engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "miaotty"
path = "src/main.rs"

[dependencies]
miao-term-core = { path = "../crates/term-core" }
miao-term-render = { path = "../crates/term-render" }
miao-term-widget = { path = "../crates/term-widget" }
miao-term-config = { path = "../crates/term-config" }
miao-term-mtp = { path = "../crates/term-mtp" }
eframe = { version = "0.30.0", features = ["wgpu"] }
